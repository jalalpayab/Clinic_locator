    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Smooth scrollbar for sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }

        /* Custom Leaflet Map Controls Modernization */
        .leaflet-popup-content-wrapper {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 4px;
        }
        .leaflet-popup-tip {
            background: #0f172a;
        }
        
        /* Accordion transition utility */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content.open {
            max-height: 1000px;
        }
        
        .arrow-icon {
            transition: transform 0.3s ease;
        }
        .arrow-icon.rotate {
            transform: rotate(180deg);
        }
    </style>
</head>

        function renderSidebar() {
            const container = document.getElementById('provinceListContainer');
            container.innerHTML = '';

            clinicData.forEach((data, index) => {
                const count = data.clinics.length;
                const statusBadge = data.status ? `<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-normal ml-2">${data.status}</span>` : '';

                const provinceItem = document.createElement('div');
                provinceItem.className = "province-block";
                provinceItem.setAttribute('data-province', data.province.toLowerCase());

                let clinicsHTML = '';
                if (count === 0) {
                    clinicsHTML = `<div class="p-3 text-xs text-slate-500 italic pl-6 bg-slate-950/40">No clinics registered for this area.</div>`;
                } else {
                    clinicsHTML = data.clinics.map(c => `
                        <div class="clinic-item group flex flex-col p-3 pl-7 hover:bg-indigo-600/10 border-b border-slate-800/30 cursor-pointer transition-all duration-200" 
                             onclick="selectClinic(${c.lat}, ${c.lng}, '${escapeHtml(c.name)}', '${escapeHtml(c.address)}')"
                             data-search="${c.name.toLowerCase()} ${c.address.toLowerCase()}">
                            <div class="text-xs font-semibold text-slate-200 group-hover:text-indigo-400 flex items-center justify-between">
                                <span>${c.name}</span>
                                <svg class="w-3.5 h-3.5 text-slate-600 group-hover:text-indigo-400 transform group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-1 line-clamp-1">${c.address}</div>
                        </div>
                    `).join('');
                }

                provinceItem.innerHTML = `
                    <button class="w-full px-5 py-3.5 flex items-center justify-between text-left hover:bg-slate-800/40 transition-colors duration-150 focus:outline-none" 
                            onclick="toggleProvinceAccordion(${index})">
                        <div class="flex items-center">
                            <span class="text-xs font-semibold text-slate-200 tracking-wide">${data.province}</span>
                            ${statusBadge}
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700/50">${count}</span>
                            <svg id="arrow-${index}" class="arrow-icon w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </button>
                    <div id="accordion-${index}" class="accordion-content bg-slate-950/30 divide-y divide-slate-800/20">
                        ${clinicsHTML}
                    </div>
                `;
                container.appendChild(provinceItem);
            });
        }

        /*************************************************************
         * 4. INTERACTIVE ACCORDION & MAP LOGIC
         *************************************************************/
        function toggleProvinceAccordion(index) {
            const data = clinicData[index];
            const content = document.getElementById(`accordion-${index}`);
            const arrow = document.getElementById(`arrow-${index}`);
            const isOpen = content.classList.contains('open');

            // Close all open accordions
            document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.arrow-icon').forEach(el => el.classList.remove('rotate'));

            if (!isOpen) {
                content.classList.add('open');
                arrow.classList.add('rotate');

                // Plot all clinics of this province on map
                if (data.clinics.length > 0) {
                    plotProvinceClinics(data.clinics);
                }
            } else {
                provinceMarkersGroup.clearLayers();
            }
        }

        function plotProvinceClinics(clinics) {
            provinceMarkersGroup.clearLayers();
            if (singleMarker) map.removeLayer(singleMarker);

            const bounds = [];
            clinics.forEach(c => {
                const marker = L.circleMarker([c.lat, c.lng], {
                    radius: 7,
                    fillColor: "#6366f1",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).bindPopup(`
                    <div class="p-1">
                        <strong class="text-indigo-400 text-xs font-bold block mb-1">${c.name}</strong>
                        <p class="text-[11px] text-slate-300 leading-tight">${c.address}</p>
                    </div>
                `);

                marker.on('click', () => {
                    document.getElementById('coordinates').textContent = `Lat/Lng: ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
                });

                provinceMarkersGroup.addLayer(marker);
                bounds.push([c.lat, c.lng]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [60, 60], maxZoom: 13 });
            }
        }

        function selectClinic(lat, lng, name, address) {
            provinceMarkersGroup.clearLayers();
            if (singleMarker) map.removeLayer(singleMarker);

            // Custom modern pulse marker
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `
                    <div class="relative flex items-center justify-center w-6 h-6">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-4 w-4 bg-indigo-600 border-2 border-white shadow-lg"></span>
                    </div>
                `,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            singleMarker = L.marker([lat, lng], { icon: customIcon })
                .addTo(map)
                .bindPopup(`
                    <div class="p-1">
                        <strong class="text-indigo-400 text-xs font-bold block mb-1">${name}</strong>
                        <p class="text-[11px] text-slate-300 leading-tight">${address}</p>
                    </div>
                `)
                .openPopup();

            map.setView([lat, lng], 14, { animate: true });
            document.getElementById('coordinates').textContent = `Lat/Lng: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }

        /*************************************************************
         * 5. UTILITY FUNCTIONS (SEARCH & MAP TYPE)
         *************************************************************/
        function filterLocations() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const provinceBlocks = document.querySelectorAll('.province-block');

            provinceBlocks.forEach(block => {
                const provinceName = block.getAttribute('data-province');
                const clinics = block.querySelectorAll('.clinic-item');
                let hasMatch = provinceName.includes(query);

                clinics.forEach(clinic => {
                    const searchData = clinic.getAttribute('data-search');
                    if (searchData.includes(query)) {
                        clinic.style.display = 'flex';
                        hasMatch = true;
                    } else {
                        clinic.style.display = 'none';
                    }
                });

                block.style.display = hasMatch ? 'block' : 'none';
                
                // Automatically open accordion if searching
                const accordion = block.querySelector('.accordion-content');
                if (query.length > 1 && hasMatch && accordion) {
                    accordion.classList.add('open');
                } else if (query.length === 0 && accordion) {
                    accordion.classList.remove('open');
                }
            });
        }

        function changeMapType() {
            const type = document.getElementById('map-type').value;
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer) map.removeLayer(layer);
            });

            if (type === 'streets') streets.addTo(map);
            else if (type === 'satellite') satellite.addTo(map);
            else if (type === 'terrain') terrain.addTo(map);
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        // Initialize UI
        renderSidebar();
    </script>
</body>
</html>
